<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standby Booth — Field Guide</title>
<meta name="description" content="A self-service video booth for events. Configure once, walk away, come back to a folder full of clips. No backend. No cloud. No staff." />
<meta name="theme-color" content="#F5F1E8" id="sb-theme-color" />

<!-- Open Graph -->
<meta property="og:title" content="Standby Booth — Field Guide" />
<meta property="og:description" content="A self-service video booth for events. Same Attract template, six brand worlds." />
<meta property="og:image" content="assets/hero-anywhere.png" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://standbybooth.com/" />
<meta name="twitter:card" content="summary_large_image" />

<!-- Favicon -->
<link rel="icon" type="image/png" href="assets/icon-1024.png" />
<link rel="apple-touch-icon" href="assets/icon-1024.png" />

<!-- Theme boot — runs BEFORE stylesheet to avoid flash-of-wrong-theme.
     Order of precedence: localStorage choice > system prefers-color-scheme > light. -->
<script>
(function () {
  try {
    var stored = localStorage.getItem("sb-theme");
    var theme = stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
    var meta = document.getElementById("sb-theme-color");
    if (meta) meta.setAttribute("content", theme === "dark" ? "#14110D" : "#F5F1E8");
  } catch (e) { /* localStorage blocked — fall through to CSS default */ }
})();
</script>

<!-- Consent layer — Consent Mode v2 defaults, the EEA/UK consent banner,
     and consent-gated loaders for GA4, Meta Pixel, and PostHog.
     Synchronous on purpose so the defaults land before anything else. -->
<script src="/assets/consent.js"></script>

<!-- Fonts (self-hosted — see assets/fonts.css) -->
<link rel="stylesheet" href="/assets/fonts.css" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<!-- React + Babel from CDN. Pinned versions for predictable behavior. -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<!-- Static data first (define globals on window). -->
<script src="brands.js"></script>
<script src="admin-data.js"></script>

<!-- JSX components. Babel transpiles at runtime. -->
<script type="text/babel" data-presets="env,react" src="attract.jsx"></script>
<script type="text/babel" data-presets="env,react" src="app.jsx"></script>
</body>
</html>
